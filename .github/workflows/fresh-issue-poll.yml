name: fresh-issue-poll

# Fast lane for issue discovery. The desktop automation scheduler cannot fire
# more often than once an hour, but a good-first-issue is typically claimed
# within ~15 minutes, so this polls a shorter cycle and reports into an inbox
# issue with an @mention (that mention is what produces the notification).
#
# Claiming and code work stay in the hourly pipeline; this only reports.
#
# Cadence strategy, revised 2026-11-01: the `*/5` schedule registered 34 slots in
# 166 minutes and fired once (2.9%), which is not the drift GitHub documents.
# Instead of trusting the trigger, the job now takes a long shift: one trigger
# starts a loop that polls every six minutes for 340 minutes. A trigger every
# few hours then delivers near-continuous coverage, so the same flaky schedule
# that was useless as a five-minute timer is sufficient as a shift starter.

on:
  schedule:
    - cron: "*/5 * * * *"
    # Control timer, kept to tell the mechanisms apart while the shift design
    # beds in: if 13,43 fires and */5 stays silent, high cadence on this repo is
    # being throttled; if neither fires, schedule is unreliable here in general.
    # Every run logs github.event.schedule, so each run names its own timer.
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: fresh-issue-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs may run for six hours. The shift stops itself at 340
    # minutes so it always exits on its own terms rather than being killed.
    timeout-minutes: 355
    steps:
      - name: Which timer fired
        run: |
          echo "event = ${{ github.event_name }}"
          echo "timer = [${{ github.event.schedule }}]"
          echo "now   = $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll in a loop for the length of the shift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minimum lookback; the script widens it to cover the gap since the
          # previous poll, because triggers are rare and irregular.
          WINDOW_MIN: "20"
          WINDOW_MAX_MIN: "360"
          # 360s x 88 repos = 880 requests/hour, inside the 1000/hour cap that
          # an installation token gets per repository.
          INTERVAL_SEC: "360"
          DURATION_MIN: "340"
        run: bash tools/poll_loop.sh
