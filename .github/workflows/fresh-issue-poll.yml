name: fresh-issue-poll

# Fast lane for issue discovery. A good-first-issue is typically claimed within
# ~15 minutes, so this polls a short cycle and reports into an inbox issue with
# an @mention (that mention is what produces the notification).
#
# Claiming and code work stay in the hourly pipeline; this only reports.
#
# Cadence, revised 2026-11-01 after measuring the schedule: the `*/5` entry
# registered 34 slots in 166 minutes and fired once (2.9%). Instead of relying on
# the trigger, the job takes a long shift -- one trigger starts a loop that polls
# every fifteen minutes for 340 minutes -- and then chains its own successor with
# the built-in GITHUB_TOKEN. That was verified on 2026-11-01: a self-dispatch
# from inside a run returned HTTP 204 and produced a new run five seconds later,
# so the chain needs no external scheduler and no personal access token.
#
# The schedule entries stay as a restart button. If the chain ever breaks (API
# hiccup, cancelled run, exhausted minutes), one cron hit is enough to start it
# again, and a cron hit arrives every couple of hours whether or not anyone is
# watching.
#
# Switch: setting the repository variable PIPELINE_ENABLED=false stops the lane
# within one interval and prevents it from chaining, without editing this file.
# The same flag is read by the hourly pipeline before it starts work, so one
# command turns discovery and execution off together. Unset means on.

on:
  schedule:
    # Nominal cadence is a formality here -- measured hit rate is ~3%, so this
    # is a restart button rather than a timer. Fifteen minutes matches the
    # interval the shift loop uses, so a cron hit that lands mid-shift is
    # simply absorbed by the concurrency group.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      duration_min:
        description: "shift length in minutes (340 on schedule)"
        type: string
        default: "340"
      chain:
        description: "start the next shift when this one ends"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  # write, not read: chaining the next shift is a workflow_dispatch call, and
  # with only read the dispatch returns 403 "Resource not accessible by
  # integration". write still covers the run-history lookup read was for.
  actions: write

# Serialise shifts. A trigger that arrives mid-shift waits instead of running a
# second poller over the same repos and doubling the API spend.
concurrency:
  group: fresh-issue-poll
  cancel-in-progress: false

jobs:
  poll:
    # Off switch, checked before a runner is even allocated. An unset variable
    # leaves the job enabled, so nothing changes for a repo that never sets it.
    if: vars.PIPELINE_ENABLED != 'false'
    runs-on: ubuntu-latest
    # GitHub-hosted jobs may run for six hours. The shift stops itself at 340
    # minutes so it always exits on its own terms rather than being killed.
    timeout-minutes: 358
    steps:
      - name: Which timer fired
        run: |
          echo "event = ${{ github.event_name }}"
          echo "timer = [${{ github.event.schedule }}]"
          echo "now   = $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll in a loop for the length of the shift
        id: shift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minimum lookback; the script widens it to cover the gap since the
          # previous poll, so a gap between shifts cannot lose issues.
          WINDOW_MIN: "20"
          WINDOW_MAX_MIN: "360"
          # 900s x 88 repos = 352 requests/hour, a third of the 1000/hour cap an
          # installation token gets per repository. Widening the window is free;
          # shortening the interval is what costs budget.
          INTERVAL_SEC: "900"
          DURATION_MIN: ${{ inputs.duration_min || '340' }}
        run: |
          date +%s > /tmp/shift_start
          echo "shift_minutes=${DURATION_MIN}" >> "$GITHUB_OUTPUT"
          bash tools/poll_loop.sh

      - name: Chain the next shift
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_MIN: ${{ inputs.duration_min || '340' }}
          CHAIN: ${{ inputs.chain }}
          ENABLED: ${{ vars.PIPELINE_ENABLED }}
        run: |
          set -u
          # A scheduled run has no inputs at all, so an empty CHAIN means yes.
          chain="${CHAIN:-true}"
          if [ "$chain" != "true" ]; then
            echo "chain disabled for this run, stopping"
            exit 0
          fi

          # Re-read the switch at the end of the shift rather than trusting the
          # value from job start: the point of an off switch is that it stops
          # things now, and a shift can be hours long.
          if [ "${ENABLED:-}" = "false" ]; then
            echo "PIPELINE_ENABLED=false, not chaining"
            exit 0
          fi

          started=$(cat /tmp/shift_start 2>/dev/null || echo 0)
          now=$(date +%s)
          elapsed=$(( now - started ))
          echo "shift ran $(( elapsed / 60 )) minute(s) of a requested $REQUESTED_MIN"

          # Guard against turning a broken loop into a tight dispatch cycle: if
          # the shift died early, do not immediately start another. Half the
          # requested length is the floor, so a crash at minute two waits for
          # the schedule or a human rather than burning runs in a fast loop.
          floor=$(( REQUESTED_MIN / 2 ))
          [ "$floor" -lt 1 ] && floor=1
          if [ "$elapsed" -lt $(( floor * 60 )) ]; then
            echo "shorter than ${floor}m floor, leaving the restart to the schedule"
            exit 0
          fi

          code=$(curl -s -o /tmp/dispatch.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/fresh-issue-poll.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"duration_min\":\"${REQUESTED_MIN}\",\"chain\":\"true\"}}")
          echo "dispatch HTTP $code"
          if [ "$code" = "204" ]; then
            echo "next shift queued; it starts as soon as this job releases the concurrency group"
          else
            cat /tmp/dispatch.txt
            exit 1
          fi
