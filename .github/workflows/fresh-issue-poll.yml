name: fresh-issue-poll

# Fast lane for issue discovery. The desktop automation scheduler cannot fire
# more often than once an hour, but a good-first-issue is typically claimed
# within ~15 minutes, so this polls a shorter cycle and reports into an inbox
# issue with an @mention (that mention is what produces the notification).
#
# Claiming and code work stay in the hourly pipeline; this only reports.
#
# 5-minute cadence: GitHub's minimum for cron is 5 minutes, and since this repo
# is public, Actions minutes for standard runners are free, so the cadence costs
# nothing. Note GitHub can delay scheduled runs under load; expect drift.

on:
  schedule:
    - cron: "*/5 * * * *"
    # Control timer. The */5 entry has fired once in 158 minutes, which is far
    # outside the drift GitHub documents. Registering a second, deliberately
    # low-frequency entry tells the two hypotheses apart: if this one keeps
    # firing and */5 does not, high cadence on this repo is being throttled; if
    # neither fires, schedule is unreliable here in general. The job logs
    # `github.event.schedule`, so each run names its own timer.
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: fresh-issue-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Which timer fired
        run: |
          echo "event = ${{ github.event_name }}"
          echo "timer = [${{ github.event.schedule }}]"
          echo "now   = $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll watched repos for newly opened issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minimum lookback; the script widens it to cover the gap since the
          # previous successful run, because the cron is not a real 5-min timer.
          WINDOW_MIN: "20"
          WINDOW_MAX_MIN: "360"
        run: python tools/poll_fresh.py
